apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
  namespace: prod-analytics
spec:
  configuration:
    clusters:
      - name: main
        layout:
          shardsCount: 1
          replicasCount: 1
        templates:
          podTemplate: clickhouse-template
          volumeClaimTemplate: storage-template
    settings:
      # === ОТКЛЮЧЕНИЕ ТЯЖЕЛЫХ СИСТЕМНЫХ ЛОГОВ ===
      processors_profile_log: _removed_
      metric_log: _removed_
      query_thread_log: _removed_
      
      # === СРОК ЖИЗНИ ЛОГОВ (секунды) ===
      max_system_log_age: 43200  # 12 часов = 43200 сек
      
      # === ФОНОВЫЕ СЛИЯНИЯ ===
      background_pool_size: 6
      background_merges_mutations_concurrency_ratio: 5
      
      # === НАСТРОЙКИ MERGETREE ===
      merge_tree:
        # КРИТИЧНО: удаление целых частей по TTL
        ttl_only_drop_parts: 1
        
        # Частота слияний с TTL
        merge_with_ttl_timeout: 1800  # 30 минут
        merge_with_recompression_ttl_timeout: 1800
        
        # Параллелизм TTL слияний
        max_number_of_merges_with_ttl_in_pool: 4
        max_replicated_merges_with_ttl_in_queue: 4
        
        # Баланс больших/малых слияний
        number_of_free_entries_in_pool_to_lower_max_size_of_merge: 3
        number_of_free_entries_in_pool_to_execute_optimize_entire_partition: 20
    
    # === НАСТРОЙКА TTL ДЛЯ СИСТЕМНЫХ ТАБЛИЦ ===
    files:
      users.d/adv_bot_user.xml: |
        <clickhouse>
          <users>
            <adv_bot_user>
              <password_sha256_hex>161314a4524df179390ec030c6b999e37eeaf77dbbf04f56f9dcbfa7504fbacf</password_sha256_hex>
              <networks>
                <ip>::/0</ip>
              </networks>
              <profile>default</profile>
            </adv_bot_user>
          </users>
        </clickhouse>
      config.d/log_path.xml: |
        <clickhouse>
          <logger>
            <level>information</level>
            <log>/opt/bitnami/clickhouse/logs/clickhouse-server.log</log>
            <errorlog>/opt/bitnami/clickhouse/logs/clickhouse-error.log</errorlog>
            <size>100M</size>
            <count>10</count>
          </logger>
        </clickhouse>
      config.d/system_logs_ttl.xml: |
        <clickhouse>
          <!-- Отключить тяжелые логи -->
          <processors_profile_log remove="1"/>
          <metric_log remove="1"/>
          <query_thread_log remove="1"/>
          
          <!-- TTL для оставшихся логов -->
          <query_log>
            <database>system</database>
            <table>query_log</table>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
          </query_log>
          
          <trace_log>
            <database>system</database>
            <table>trace_log</table>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
          </trace_log>
          
          <part_log>
            <database>system</database>
            <table>part_log</table>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 2 DAY DELETE</ttl>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
          </part_log>
        </clickhouse>
  templates:
    podTemplates:
      - name: clickhouse-template
        spec:
          containers:
            - name: clickhouse
              image: harborskyline.duckdns.org/bitnami-cache/bitnami/clickhouse:25.7.5-debian-12-r0
              imagePullPolicy: IfNotPresent
              ports:
                - name: http
                  containerPort: 8123
                - name: tcp
                  containerPort: 9000
              env:
                - name: CLICKHOUSE_LOGS_DIR
                  value: /bitnami/clickhouse/data/logs
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              volumeMounts:
                - name: storage-template
                  mountPath: /bitnami/clickhouse/data
                - name: storage-template
                  mountPath: /opt/bitnami/clickhouse/logs
                  subPath: logs
                - name: storage-template
                  mountPath: /opt/bitnami/clickhouse/tmp
                  subPath: tmp
          initContainers:
            - name: fix-permissions
              image: bitnami/minideb:bookworm
              command:
                - sh
                - -c
                - |
                  echo "Fixing permissions for ClickHouse volume..."
                  mkdir -p /bitnami/clickhouse/{data,logs,tmp}
                  chown -R 1001:1001 /bitnami/clickhouse
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: storage-template
                  mountPath: /bitnami/clickhouse
          imagePullSecrets:
            - name: harbor-login-secret
          securityContext:
            fsGroup: 1001
            runAsGroup: 1001
            runAsUser: 1001

    volumeClaimTemplates:
      - name: storage-template
        reclaimPolicy: Retain
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: nvme.network-drives.csi.timeweb.cloud
          resources:
            requests:
              storage: 40Gi
    