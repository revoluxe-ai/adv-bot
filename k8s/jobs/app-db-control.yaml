# ============================================================================
# app-db-control.yaml
# ============================================================================
# Назначение: CONTROL Job — provenance-bound verify+acquire (не exec RELEASE).
# MVP: registry-layer extract / attestation verify; пишет termination-log JSON.
# Image: отдельный CONTROL/extractor, НЕ RELEASE_IMAGE.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: app-db-control-RELEASE_ID
  namespace: prod-adv-bot
  labels:
    app.kubernetes.io/name: app-db-control
    app.kubernetes.io/part-of: safe-prod-pg-migrations
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-db-control
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-skyline360-login-secret
      containers:
        - name: control
          image: harbor.skyline360.ru/git-registry-cache/revoluxe-ai/adv-bot-control:CONTROL_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.db.control_acquire"]
          env:
            - name: RELEASE_ID
              value: "RELEASE_ID"
            - name: RELEASE_PLATFORM_MANIFEST_DIGEST
              value: "RELEASE_PLATFORM_MANIFEST_DIGEST"
            - name: TARGET_PLATFORM
              value: "linux/amd64"
            - name: EXPECTED_TARGET_REVISION
              value: "EXPECTED_TARGET_REVISION"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-db-control
                  key: database_url
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
