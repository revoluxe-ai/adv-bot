# ============================================================================
# ops-script-runner.yaml
# ============================================================================
# Назначение: шаблон one-shot Kubernetes Job для /opsx-scripts RUN.
# Образ по умолчанию — Harbor proxy-cache (pull-through из GHCR), не ghcr.io.
# Placeholders: __JOB_NAME__, __NAMESPACE__, __IMAGE_REF__, __SCRIPT_PATH__,
#   __SCRIPT_ARGS__, __HOLD_SECONDS__ (default 900 = 15 min hold for kubectl cp).
# Вызывается: /opsx-scripts PLAN_RUN | RUN GO (render + kubectl apply).
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: ops-script-runner
    app.kubernetes.io/part-of: opsx-scripts
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-script-runner
        app.kubernetes.io/part-of: opsx-scripts
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-skyline360-login-secret
      containers:
        - name: ops-script
          image: __IMAGE_REF__
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              /app/.venv/bin/python __SCRIPT_PATH__ __SCRIPT_ARGS__
              echo "ops-script: success; holding __HOLD_SECONDS__s for output copy"
              sleep __HOLD_SECONDS__
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: prod-wb-gram
            - secretRef:
                name: common-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
