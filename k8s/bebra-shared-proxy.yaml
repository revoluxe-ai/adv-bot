apiVersion: apps/v1
kind: Deployment
metadata:
  name: bebra-shared-proxy
  namespace: prod-adv-bot
  labels:
    app: bebra-shared-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bebra-shared-proxy
  template:
    metadata:
      labels:
        app: bebra-shared-proxy
    spec:
      initContainers:
        # Python json.dump avoids shell expansion of secret metacharacters (unquoted <<EOF).
        - name: render-xray-config
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER
              valueFrom:
                secretKeyRef:
                  name: bebra-proxy-params
                  key: server
            - name: SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: bebra-proxy-params
                  key: server_port
            - name: METHOD
              valueFrom:
                secretKeyRef:
                  name: bebra-proxy-params
                  key: method
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bebra-proxy-params
                  key: password
          volumeMounts:
            - name: xray-config
              mountPath: /out
          command:
            - python3
            - -c
            - |
              import json
              import os

              port_raw = os.environ["SERVER_PORT"].strip()
              port = int(port_raw)

              cfg = {
                  "log": {"loglevel": "warning"},
                  "inbounds": [
                      {
                          "port": 8080,
                          "listen": "0.0.0.0",
                          "protocol": "http",
                          "settings": {},
                      }
                  ],
                  "outbounds": [
                      {
                          "protocol": "shadowsocks",
                          "settings": {
                              "servers": [
                                  {
                                      "address": os.environ["SERVER"],
                                      "port": port,
                                      "method": os.environ["METHOD"],
                                      "password": os.environ["PASSWORD"],
                                  }
                              ]
                          },
                      }
                  ],
              }
              with open("/out/config.json", "w", encoding="utf-8") as f:
                  json.dump(cfg, f, indent=2)
                  f.write("\n")
      volumes:
        - name: xray-config
          emptyDir: {}
      containers:
        - name: xray-proxy
          image: teddysun/xray:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/xray", "run", "-c", "/etc/xray/config.json"]
          volumeMounts:
            - name: xray-config
              mountPath: /etc/xray
          ports:
            - containerPort: 8080
              name: http-proxy
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bebra-shared-proxy
  namespace: prod-adv-bot
  labels:
    app: bebra-shared-proxy
spec:
  selector:
    app: bebra-shared-proxy
  ports:
    - name: http-proxy
      port: 8080
      targetPort: 8080
      protocol: TCP
