apiVersion: apps/v1
kind: Deployment
metadata:
  name: bebra-shared-proxy
  namespace: prod-adv-bot
  labels:
    app: bebra-shared-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bebra-shared-proxy
  template:
    metadata:
      labels:
        app: bebra-shared-proxy
    spec:
      volumes:
        - name: xray-config
          configMap:
            name: bebra-shared-proxy-config
            items:
              - key: config.json
                path: config.json
      containers:
        - name: xray-proxy
          image: ghcr.io/xtls/xray-core:latest
          imagePullPolicy: IfNotPresent
          args: ["run", "-c", "/etc/xray/config.json"]
          volumeMounts:
            - name: xray-config
              mountPath: /etc/xray
          ports:
            - containerPort: 8080
              name: http-proxy
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bebra-shared-proxy
  namespace: prod-adv-bot
  labels:
    app: bebra-shared-proxy
spec:
  selector:
    app: bebra-shared-proxy
  ports:
    - name: http-proxy
      port: 8080
      targetPort: 8080
      protocol: TCP
