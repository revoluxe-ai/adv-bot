[mypy]
disallow_untyped_defs = False
ignore_missing_imports = True
mypy_path = "stubs"
explicit_package_bases = True
exclude = "migrations|alembic|\.venv|env|\.env|\.eggs|\.pytest_cache|\.mypy_cache|build|dist|alembic_"
check_untyped_defs = True
disable_error_code = no-untyped-def,no-untyped-call,var-annotated,union-attr,operator,arg-type,return-value,assignment,call-arg,misc,name-defined,type-arg,override,no-redef,return


[mypy-aiofiles.*]
ignore_missing_imports = True

[mypy-app.utils.image_master.image_tools.*]
ignore_errors = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-aiogram.*]
ignore_missing_imports = True

[mypy-joblib]
ignore_missing_imports = True

[mypy-xgboost]
ignore_missing_imports = True

[mypy-faiss]
ignore_missing_imports = True

[mypy-pandas]
ignore_missing_imports = True

;[mypy-app.modules.*]
;disallow_untyped_defs = False

;# Exclude file with module duplication
;[mypy-app.modules.common_slaves.wildberries.wb_api]
;ignore_errors = True

;[mypy-modules.common_slaves.wildberries.wb_api]
;ignore_errors = True

;[mypy-app.modules.common_slaves.wildberries.models]
;ignore_errors = True

# Exclude gRPC generated files
[mypy-app.modules.grpcs.*]
ignore_errors = True

;# Exclude file with duplicate module names
;[mypy-app.modules.full_stat_adv_updater.types]
;ignore_errors = True

[mypy-modules.full_stat_adv_updater.types]
ignore_errors = True

[mypy-app.core.di.databases.redis]
disallow_subclassing_any = false

# Ignore generated promotion clients (API client codegen)
[mypy-app.core.mp.wb.api.generated.*]
ignore_errors = True


# Ignore alembic versions (generated migration scripts)
[mypy-alembic.*]
ignore_errors = True

[mypy-alembic.versions.*]
ignore_errors = True


[mypy-tests.*]
ignore_errors = True

[mypy-examples.*]
ignore_errors = True

[mypy-scripts.*]
ignore_errors = True

[mypy-app.utils.image_master.*]
ignore_errors = True