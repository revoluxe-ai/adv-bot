[mypy]
plugins = sqlalchemy.ext.mypy.plugin
strict = True
disallow_untyped_defs = True
ignore_missing_imports = False
follow_imports = skip

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-aiogram.*]
ignore_missing_imports = True

[mypy-app.modules.*]
disallow_untyped_defs = False

# Exclude file with module duplication
[mypy-app.modules.common_slaves.wildberries.wb_api]
ignore_errors = True

[mypy-modules.common_slaves.wildberries.wb_api]
ignore_errors = True

[mypy-app.modules.common_slaves.wildberries.models]
ignore_errors = True

# Exclude file with duplicate module names
[mypy-app.modules.full_stat_adv_updater.types]
ignore_errors = True

[mypy-modules.full_stat_adv_updater.types]
ignore_errors = True
