[mypy]
strict = True
disallow_untyped_defs = True
ignore_missing_imports = False
mypy_path = "stubs"
exclude = "migrations|alembic|\.venv|env|\.env|\.eggs|\.pytest_cache|\.mypy_cache|build|dist"

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-aiogram.*]
ignore_missing_imports = True

[mypy-app.modules.*]
disallow_untyped_defs = False

# Exclude file with module duplication
[mypy-app.modules.common_slaves.wildberries.wb_api]
ignore_errors = True

[mypy-modules.common_slaves.wildberries.wb_api]
ignore_errors = True

[mypy-app.modules.common_slaves.wildberries.models]
ignore_errors = True

# Exclude file with duplicate module names
[mypy-app.modules.full_stat_adv_updater.types]
ignore_errors = True

[mypy-modules.full_stat_adv_updater.types]
ignore_errors = True

[mypy-app.core.di.databases.redis]
disallow_subclassing_any = false

# Ignore generated promotion clients (API client codegen)
[mypy-app.core.mp.wb._api_client.clients.promotion.generated.*]
ignore_errors = True

[mypy-app.core.mp.wb._api_client.clients.promotion.generated]
ignore_errors = True


# Ignore alembic versions (generated migration scripts)
[mypy-alembic.*]
ignore_errors = True

[mypy-alembic.versions.*]
ignore_errors = True