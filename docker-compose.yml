  redis:
    image: redis:alpine
    mem_limit: 2g  # Ограничение максимального использования памяти до 2 гигабайт
    mem_reservation: 1g  # Рекомендуемое минимальное количество памяти для контейнера
    container_name: wbgram_bot_redis
    networks:
      - wbgram
    volumes:
      - redis_data:/data  # Монтируем volume для хранения данных
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: [ "redis-server", "--slaveof", "<master_redis_host>", "<master_redis_port>" ]  # Указываем основной Redis сервер
    restart: always

volumes:
  redis_data:


networks:
  wbgram:  # Обычная виртуальная сеть для контейнеров
    driver: bridge

