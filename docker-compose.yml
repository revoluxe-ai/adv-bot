  client_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wbgram_bot
    networks:
      - wbgram
    command: python client_bot_run.py
    environment:
      - CPU_SHARES=512
      - MEMORY_LIMIT=512M
    mem_limit: 512m
    cpus: 2  # Используем 2 процессора
    volumes:
      - .:/app  # Монтируем текущий каталог в контейнер
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

