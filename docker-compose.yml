  client_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wbgram_bot
    networks:
      - wbgram
    command: python client_bot_run.py
    mem_limit: 8G
    cpus: 4
    volumes:
      - .:/app  # Монтируем текущий каталог в контейнер
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always


  redis:
    image: redis:alpine
    container_name: wbgram_bot_redis
    networks:
      - wbgram
    volumes:
      - redis_data:/data
    mem_limit: 2g
    mem_reservation: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
#    command: ["redis-server", "--replicaof", "host", "6379"]
    restart: always




volumes:
  redis_data:


networks:
  wbgram:  # Обычная виртуальная сеть для контейнеров
    driver: bridge

