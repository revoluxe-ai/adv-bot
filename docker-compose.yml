#for kubernetes
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adv_wb_bot_backend
    command: python updater.py
    mem_limit: 8G
    cpus: 16
    image: adv_wb_bot_backend
    restart: always
    network_mode: host
    volumes:
      - ./work_folder:/app/work_folder


  client_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wbgram_bot
    command: python client_bot_run.py
    image: wbgram_bot
    restart: always
    network_mode: host

