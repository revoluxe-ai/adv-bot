services:

  bidder:
    build:
      context: .
      dockerfile: ./dockers/bidder/Dockerfile
    container_name: bidder

  bot:
    build:
      context: .
      dockerfile: ./dockers/client_bot/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}  # Пример использования переменной из окружения
      REDIS_HOST: ${REDIS_HOST}
      REDIS_CLUSTER_HOST: ${REDIS_CLUSTER_HOST}

  updater:
    build:
      context: .
      dockerfile: ./dockers/updater/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      REDIS_HOST: ${REDIS_HOST}

  celery:
    build:
      context: .
      dockerfile: ./dockers/celery/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      REDIS_HOST: ${REDIS_HOST}
      CELERY_PREFIX: ${CELERY_PREFIX}


  model_updater:
    build:
      context: .
      dockerfile: ./dockers/model_updater/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      REDIS_HOST: ${REDIS_HOST}


  redis_copy_script:
    build:
      context: .
      dockerfile: ./dockers/copy_redis_script/Dockerfile

