{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="card">
  <h1>Регистрация</h1>
  <form
    class="stack"
    hx-post="/register"
    hx-target="#register-result"
    hx-swap="innerHTML"
  >
    <label>
      Email
      <input name="email" type="email" required autocomplete="email"/>
    </label>
    <label>
      Пароль
      <input name="password" type="password" required minlength="8" autocomplete="new-password"/>
    </label>
    <label>
      Подтверждение пароля
      <input name="password_confirm" type="password" required minlength="8" autocomplete="new-password"/>
    </label>
    <button type="submit" class="primary">Зарегистрироваться</button>
  </form>
  <div id="register-result" class="result-area" aria-live="polite"></div>
</section>
{% endblock %}
