syntax = "proto3";

package image_vector_service;

// Запрос на получение вектора из изображения
message ImageRequest {
  bytes image = 1;  // Байты изображения (JPEG/PNG)
  string mime = 2;  // MIME тип изображения (опционально)
}

// Ответ с вектором признаков
message VectorResponse {
  repeated float vector = 1;  // Вектор признаков (float32)
  bool found = 2;             // Флаг успешного извлечения вектора
}

// Сервис для извлечения векторов признаков из изображений
service ImageVectorService {
  rpc GetVector(ImageRequest) returns (VectorResponse);
}
