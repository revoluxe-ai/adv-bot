# итоговый валидный конфиг
schema: spec-driven
profile: core

context: |
  Проект:
    WB Sky — коммерческий продукт для автоматизации и анализа внутренней рекламы Wildberries.

  Бизнес-цель:
    Проект должен приносить владельцу доход, помогать продавцам улучшать рекламу
    и снижать нагрузку на поддержку через понятные self-service сценарии,
    встроенные объяснения, диагностику и подсказки внутри бота.

  Текущее состояние:
    В проекте уже есть paid automation product.
    Free bot находится в разработке и должен стать полезным входным freemium-слоем,
    а не пустой демо-версией.

  Главный принцип:
    Free bot должен быть полезным, но не должен бесплатно отдавать paid automation core.

  Важные доменные зоны:
    Высокорисковыми считаются изменения, которые затрагивают:
      - ставки;
      - CPO/CPA;
      - V3/V2 updater logic;
      - ApplyManager;
      - lifecycle кампаний;
      - автозапуск / автоостановку;
      - WB API write actions;
      - БД и миграции;
      - превышение расхода сверх нормы;
      - необоснованное или непонятное пользователю отсутствие трафика;
      - ошибки списания платы за бот;
      - работу с большим количеством РК: тысячи и десятки тысяч.

  Free/Paid граница:
    Free bot должен максимально использовать read-only value:
      - аналитика;
      - диагностика;
      - объяснения;
      - preview;
      - export/import Excel;
      - onboarding;
      - navigation;
      - lead capture;
      - paid offer routing;
      - другие read-only сценарии, если они не выполняют WB write actions
        и не отдают paid automation core.

    Paid automation core не должен бесплатно отдаваться во Free:
      - автоматическое обновление ставок в shelf-кампаниях;
      - автоматическое обновление общей ставки поисковых РК;
      - автоматическое обновление целевых позиций ключей;
      - автоматическое обновление whitelist;
      - автоматическая остановка или запуск кампаний;
      - auto-updaters, влияющие на рекламу, ставки, ключи, whitelist,
        target place или campaign lifecycle.

    Manual self-service во Free:
      Ручное изменение может быть допустимо только если отдельный spec явно описывает
      preview, объяснение, affected records и explicit confirmation пользователя.

    Default:
      В Free режиме все WB write-действия выключены по умолчанию.

  Обратная совместимость:
    Paid bot и существующий paid-интерфейс нельзя ломать без отдельного proposal.
    Backend может быть общим, но Free/Paid поведение должно разделяться через access guards.

  Видение на будущее:
    В перспективе adv-bot должен развиваться не просто как платный инструмент
    автоуправления рекламой, а как self-service продукт с бесплатной версией,
    партнёрской программой, встроенным обучением пользователя и AI-first
    поддержкой. Цель — снизить ручную нагрузку владельца и сделать так,
    чтобы пользователь мог разобраться, получить пользу, дойти до платного
    сценария и решить типовые проблемы без личного участия владельца.

  Current/Future boundary:
    Видение на будущее не является текущим поведением системы.
    Нельзя писать production-код под future vision без отдельного OpenSpec change.

rules:
  proposal:
    - "Всегда включать intent, scope in/out, current behavior, desired behavior, impact, risk и rollback idea."
    - "Один change должен иметь один intent."
    - "Proposal должен объяснять зачем и в каких границах делается изменение."
    - "Не писать в proposal список файлов, классов, функций или SQL-запросов."
    - "Явно указывать out of scope."
    - "Не смешивать current behavior и future desired behavior."
    - "Писать на русском языке."
    - "Английские structural keywords допустимы только там, где они нужны OpenSpec: MUST, MUST NOT, SHOULD, GIVEN, WHEN, THEN, ADDED, MODIFIED, REMOVED."
    - "Если пользователь формулирует смысл по-русски, сохранять русский смысл и не расширять его от себя."

  specs:
    - "Любое изменение считать high-risk, если оно затрагивает ставки, CPO/CPA, V3/V2 updater logic, ApplyManager, lifecycle кампаний, автозапуск / автоостановку, WB API write actions, БД и миграции, paid/free boundary, списание платы за бот, управление активностью ключей, перерасход/недорасход, управление ставкой ключей или bidder behavior."
    - "Описывать observable behavior, а не implementation."
    - "Использовать GIVEN/WHEN/THEN scenarios."
    - "Не включать classes, functions, SQLAlchemy, Redis, file paths или implementation details."
    - "Чётко отделять Free value от Paid automation."
    - "Чётко отделять read-only поведение от write-path."
    - "Не создавать отдельный spec под каждое меню, экран, keyboard, file или handler."
    - "Specs должны описывать stable product behavior или access boundary."
    - "Любое Free bot write action должно явно отличать ручное user-confirmed действие от automation."
    - "Manual self-service actions нельзя описывать как automatic optimization."
    - "Писать на русском языке."
    - "Английские structural keywords допустимы только там, где они нужны OpenSpec: MUST, MUST NOT, SHOULD, GIVEN, WHEN, THEN, ADDED, MODIFIED, REMOVED."
    - "Если пользователь формулирует смысл по-русски, сохранять русский смысл и не расширять его от себя."

  design:
    - "Перед техническими изменениями изучать существующую реализацию."
    - "Учитывать текущий стек проекта: Python 3.11, SQLAlchemy + PostgreSQL, dependency-injector, ClickHouse, Redis; перед использованием смотреть текущую практику в затронутом участке."
    - "Переиспользовать существующие project patterns, если нет явно описанной причины отклониться."
    - "Описывать affected components, side effects, access guards, validation plan, rollback idea и performance considerations."
    - "Технические детали, data flow, queries, modules и file changes писать в design, а не в spec."
    - "Для любого write-path описывать preview, explicit confirmation, affected records, recovery/rollback idea и tests."
    - "Перед изменениями Free/Paid поведения найти и классифицировать все WB-impacting write paths."
    - "Писать на русском языке."
    - "Английские structural keywords допустимы только там, где они нужны OpenSpec: MUST, MUST NOT, SHOULD, GIVEN, WHEN, THEN, ADDED, MODIFIED, REMOVED."
    - "Если пользователь формулирует смысл по-русски, сохранять русский смысл и не расширять его от себя."
    - "создавать большие MagicMock-замены доменных моделей без проверки tests/factories и существующих fixtures"

  tasks:
    - "Для high-risk и behavior-changing changes tasks должны начинаться с tests-first шагов."
    - "Сначала добавлять или обновлять regression/characterization tests, затем менять production code."
    - "Тест не должен мокать функцию, фильтрацию или decision logic, поведение которой он проверяет."
    - "Tasks должны быть маленькими, последовательными, проверяемыми."
    - "Включать characterization tests перед изменением рискованного или неясного поведения."
    - "Включать regression tests для bug fixes."
    - "Включать targeted tests для каждой новой или изменённой decision function."
    - "Включать tests для business invariants и forbidden side effects."
    - "Не добавлять поверхностные tests, которые проверяют только существование результата."
    - "Писать на русском языке."
    - "Английские structural keywords допустимы только там, где они нужны OpenSpec: MUST, MUST NOT, SHOULD, GIVEN, WHEN, THEN, ADDED, MODIFIED, REMOVED."

