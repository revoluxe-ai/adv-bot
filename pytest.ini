[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = tests

python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*
# Run fast smoke-like tests: pytest -m fast
# Run only integration tests: pytest -m integration
addopts = -v --tb=short
# В репозитории лежат docker-volume данные (например, ClickHouse), которые на Windows
# могут падать на os.stat() при рекурсивном обходе (WinError 1920). При `pytest .`
# pytest обходит всё дерево (включая app/**/test_*.py), поэтому эти папки исключены.
# Рекомендуемый запуск: `poetry run pytest` или `poetry run pytest tests` (см. testpaths).
# Integration: `poetry run pytest -m integration` (нужен docker compose из tests/docker-compose.test.yml).
norecursedirs =
    tests/tests_entry_points
    clickhouse-data
    data-redis
    redis-data
# Every test is exactly unit or integration (assigned by path in conftest or default unit).
markers =
    asyncio: mark test as async
    circular_imports: tests for circular imports detection
    fast: fast feedback suite (tests/unit by default)
    unit: mark test as unit test
    integration: mark test as integration test
    sandbox: mark test as sandbox test (requires real API)
    slow: mark test as slow running
    paid_regression: paid tier must-not-break suite (bot_active=True contracts)
    bot_active_gates: free tier WB write gates (bot_active=False must not mutate WB)