[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"



line-length = 88
target-version = "py311"
preview = true   # <-- теперь здесь, не в .lint
# другие настройки
ignore = [
  "F821",  # «undefined name», пока вручную не смотреть
  "F401",  # неиспользуемые импорты (часто __init__.py)
]


[tool.ruff.lint]
extend-select = ["UP"]  # pyupgrade, можно добавить другие
unfixable = ["F401"]
ignore-init-module-imports = true
ignore = [
    "E402",  # импорт не в начале файла
    "E722",  # bare except
    "F403",  # from x import *
    "F405",  # имена из *-импорта
    "F811",  # переопределения
    "F401",  # неиспользуемые импорты (__init__.py)
]


[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["E722", "F841"]
fixable = ["ALL"]
unfixable = ["F401"]
