[tool.poetry]
name = "predict-ctr-service"
version = "0.1.0"
description = ""
authors = ["Andrey <vkitaebiz@gmail.com>"]
readme = "README.md"
packages = [{ include = "predict_ctr_service" }]  # если у тебя основная папка называется app

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]
strict = true
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = true
python_version = "3.13"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "predict_ctr_service.dto.calculated_keyword"
ignore_errors = true

[[tool.mypy.overrides]]
module = "predict_ctr_service.utils.fitter"
disable_error_code = ["annotation-unchecked", "import"]

# Автогенерированный gRPC — полностью игнорируем ошибки (mypy будет пропускать этот модуль)
[[tool.mypy.overrides]]
module = "predict_ctr_service.grpc_service.predict_ctr_service_pb2_grpc"
ignore_errors = true

[[tool.mypy.overrides]]
module = "predict_ctr_service.utils.session_maker"
ignore_errors = true

[tool.poetry.dependencies]
python = "3.13.*"
grpcio = "^1.75.1"
protobuf = "^6"
googleapis-common-protos = "^1.61.0"
numpy = "^2.3.3"
pandas = "^2.3.2"
sqlalchemy = "^2.0.43"
xgboost = "^3.0.5"
aiofiles = "^24.1.0"
joblib = "^1.5.2"
dotenv = "^0.9.9"
asyncpg = "^0.30.0"
pydantic = "^2.11.9"
redis = "^6.4.0"
clickhouse-connect = "^0.9.2"
