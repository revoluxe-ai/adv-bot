services:
  test_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: test_adv_bot_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432" # Используем другой порт, чтобы избежать конфликтов с основной БД
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_adv_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Для тестов не сохраняем данные постоянно, чтобы каждый раз была чистая база
    # volumes:
    #   - ./pg_data_test:/var/lib/postgresql/data
