name: Migration gates

on:
  pull_request:
    paths:
      - "alembic_/**"
      - "alembic.ini"
      - "app/db/**"
      - "tests/migrations/**"
      - ".github/workflows/migration-gates.yml"
      - ".github/ci/migration-ephemeral.env"
      - "k8s/jobs/**"
      - "k8s/migrations/**"
      - "scripts/Invoke-ProdDbMigrateThenRollout.ps1"

jobs:
  migration-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
      - name: Install deps
        run: poetry install --no-interaction --no-ansi
      - name: Alembic single head
        run: |
          poetry run alembic heads
          test "$(poetry run alembic heads | wc -l)" -eq 1
      - name: Pytest migrations unit
        run: poetry run pytest tests/migrations -q

  migration-ephemeral-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: replay
          POSTGRES_USER: replay
          POSTGRES_DB: replay_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
      - name: Install deps
        run: poetry install --no-interaction --no-ansi
      - name: Expand head + BASE detection on ephemeral PG
        env:
          DATABASE_URL: postgresql://replay:replay@localhost:5432/replay_db
          POSTGRES_PORT: "5432"
          POSTGRES_DBNAME: replay_db
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: replay
          POSTGRES_MASTER_HOST: localhost
          POSTGRES_REPLICA_HOST: localhost
        run: |
          set -a
          # shellcheck disable=SC1091
          source .github/ci/migration-ephemeral.env
          set +a
          # Full historical upgrade-from-empty is not CI-safe (legacy out-of-order
          # revisions). Gate the release Expand path: stub table → stamp parent → head.
          poetry run python - <<'PY'
          from sqlalchemy import create_engine, text
          eng = create_engine("postgresql://replay:replay@localhost:5432/replay_db")
          with eng.begin() as conn:
              conn.execute(text("CREATE TABLE IF NOT EXISTS advsetting (id SERIAL PRIMARY KEY)"))
              conn.execute(text(
                  "CREATE TABLE IF NOT EXISTS auto_shelf_bid_control_settings (id BIGSERIAL PRIMARY KEY)"
              ))
              conn.execute(text(
                  "CREATE TABLE IF NOT EXISTS auto_shelf_bid_control_state (id BIGSERIAL PRIMARY KEY)"
              ))
          eng.dispose()
          print("stub advsetting+auto_shelf ok")
          PY
          PARENT=$(poetry run python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          assert len(heads) == 1, heads
          rev = script.get_revision(heads[0])
          print(rev.down_revision)
          PY
          )
          HEAD=$(poetry run python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          print(ScriptDirectory.from_config(Config("alembic.ini")).get_heads()[0])
          PY
          )
          echo "stamp $PARENT then upgrade to $HEAD"
          poetry run alembic stamp "$PARENT"
          poetry run alembic upgrade head
          # Do NOT run `alembic check` here: stub schema ≠ full models (expected drift).
          test "$(poetry run alembic current | awk '{print $1}')" = "$HEAD"
          # Head e8f9 adds shelf-exhausted SoT columns; stamp(parent) skips f2a3
          # Expand DDL, so do not assert card_ab_hold_emergency_* on advsetting.
          poetry run python - <<'PY'
          from sqlalchemy import create_engine, text
          eng = create_engine("postgresql://replay:replay@localhost:5432/replay_db")
          with eng.connect() as conn:
              settings_rows = conn.execute(
                  text(
                      "SELECT column_name FROM information_schema.columns "
                      "WHERE table_name='auto_shelf_bid_control_settings' "
                      "AND column_name IN ('retest_interval_days')"
                  )
              ).fetchall()
              settings_cols = {r[0] for r in settings_rows}
              assert settings_cols == {"retest_interval_days"}, settings_cols
              state_rows = conn.execute(
                  text(
                      "SELECT column_name FROM information_schema.columns "
                      "WHERE table_name='auto_shelf_bid_control_state' "
                      "AND column_name IN ('shelf_exhausted_pause_active')"
                  )
              ).fetchall()
              state_cols = {r[0] for r in state_rows}
              assert state_cols == {"shelf_exhausted_pause_active"}, state_cols
              print(
                  "e8f9 shelf-exhausted columns ok",
                  sorted(settings_cols | state_cols),
              )
          eng.dispose()
          PY
          # Missing alembic_version ⇒ BASE (42P01 only)
          poetry run python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.db.migrate import _db_heads
          eng = create_engine("postgresql://replay:replay@localhost:5432/replay_db")
          with eng.begin() as conn:
              conn.execute(text("DROP TABLE IF EXISTS alembic_version"))
          with eng.connect() as conn:
              assert _db_heads(conn) == frozenset({"BASE"}), _db_heads(conn)
              print("BASE detection ok")
          eng.dispose()
          PY
