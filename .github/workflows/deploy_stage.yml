name: Yandex Cloud Stage Deploy

on:
  push:
    branches: [stage]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: common-wb-adv-bot
            # Здесь указываем имя репозитория внутри проекта, например "common-wb-adv-bot"
            repo_name: common-wb-adv-bot-stage
            dockerfile: ./dockers/Dockerfile
    env:
      # Имя проекта в Harbor (создай проект "wb-adv-bot" в интерфейсе Harbor)
      HARBOR_PROJECT: wb-adv-bot
      # Имя репозитория (обычно имя сервиса)
      CR_REPOSITORY: ${{ matrix.repo_name }}
      IMAGE_TAG: ${{ github.sha }}
      LATEST_TAG: stage
      HARBOR_REGISTRY: harbor.skyline360.ru  # Адрес Harbor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-stage-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-stage-

      - name: Login to Harbor registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.HARBOR_REGISTRY }} --username ${{ secrets.HARBOR_USERNAME }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform=linux/amd64 \
            --push \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.CR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.CR_REPOSITORY }}:${{ env.LATEST_TAG }} \
            -f ${{ matrix.dockerfile }} .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Cleanup old images
        run: |
          docker buildx prune -f
          docker system prune -f

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.STAGE_SERVER }}/health || exit 1
