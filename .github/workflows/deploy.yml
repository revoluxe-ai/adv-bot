name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: common-wb-adv-bot
            # Здесь указываем имя репозитория внутри проекта, например "common-wb-adv-bot"
            repo_name: common-wb-adv-bot
            dockerfile: ./dockers/Dockerfile
    env:
      # Имя проекта в Harbor (создай проект "wb-adv-bot" в интерфейсе Harbor)
      HARBOR_PROJECT: wb-adv-bot
      # Имя репозитория (обычно имя сервиса)
      CR_REPOSITORY: ${{ matrix.repo_name }}
      IMAGE_TAG: ${{ github.sha }}
      LATEST_TAG: latest
      HARBOR_REGISTRY: https://harbor.skyline360.ru  # Адрес Harbor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.HARBOR_REGISTRY }} --username ${{ secrets.HARBOR_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --no-cache \
            --platform=linux/amd64 \
            --push \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.CR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.CR_REPOSITORY }}:${{ env.LATEST_TAG }} \
            -f ${{ matrix.dockerfile }} .
