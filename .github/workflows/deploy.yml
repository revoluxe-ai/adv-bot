name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: common-wb-adv-bot
            repo_name: common-wb-adv-bot
            dockerfile: ./dockers/Dockerfile

    container:
      image: atnartur/yc:latest

    env:
      CR_REGISTRY: crp8gok4kl514qunoimr
      CR_REPOSITORY: ${{ matrix.repo_name }}
      IMAGE_TAG: ${{ github.sha }}
      LATEST_TAG: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Yandex Cloud Container Registry
        run: |
          echo "${{ secrets.YC_OAUTH_TOKEN }}" | docker login --username oauth --password-stdin cr.yandex

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --no-cache \
            --platform=linux/amd64 \
            --push \
            -t cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG} \
            -t cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${LATEST_TAG} \
            -f ${{ matrix.dockerfile }} .
