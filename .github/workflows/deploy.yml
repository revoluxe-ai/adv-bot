name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: client-telegram-bot
            repo_name: client-telegram-bot
            dockerfile: ./dockers/client-bot/Dockerfile

    container:
      image: atnartur/yc:latest

    steps:
      # 1. Логин в Yandex Cloud Container Registry
      - name: Login to Yandex Cloud Container Registry
        run: |
          echo ${{ secrets.YC_OAUTH_TOKEN }} | docker login \
            --username oauth \
            --password-stdin \
            cr.yandex

      # 2. Клонирование репозитория
      - uses: actions/checkout@v4

      # 3. Кэширование слоев Docker
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # 4. Сборка Docker-образа
      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 1
          CR_REGISTRY: crp8gok4kl514qunoimr
          CR_REPOSITORY: ${{ matrix.repo_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMIT_SHA=${{ github.sha }}
          echo "Собираем образ с тегом: cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG}"

          # Сборка с использованием кэша из удаленного реестра
          docker build --cache-from=cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:latest \
            -t cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG} \
            -f ${{ matrix.dockerfile }} .

      # 5. Пуш Docker-образов в реестр
      - name: Push Docker image to Yandex Cloud Container Registry
        run: |
          docker tag cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG} cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:latest
          docker push cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG}
          docker push cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:latest
