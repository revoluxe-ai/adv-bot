name: Build and Deploy to Yandex Cloud Container Registry

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /usr/local/bin
          source ~/.bashrc
          yc --version
      - name: Логинимся в Yandex Cloud
        run: |
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set token ${{ secrets.YC_OAUTH_TOKEN }}

      - name: Логинимся в Yandex Container Registry
        run: |
          yc container registry configure-docker
          echo ${{ secrets.YC_OAUTH_TOKEN }} | docker login --username oauth --password-stdin cr.yandex

      - name: Извлекаем название приложения из папки
        id: app_name
        run: |
          # Извлекаем название папки, где находится Dockerfile
          APP_NAME=$(basename $(dirname dockers/client_bot))
          echo "app_name=$APP_NAME" >> $GITHUB_ENV

      - name: Сборка и пуш Docker-образа с тегами
        run: |
          # Получаем SHA коммита
          COMMIT_SHA=${{ github.sha }}
          
          # Путь к Dockerfile
          DOCKERFILE_PATH=dockers/client_bot/Dockerfile
          
          # Используем динамическое название приложения для тегов
          docker build -f $DOCKERFILE_PATH -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}:$COMMIT_SHA -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}:latest -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}:$APP_NAME .
          
          # Пушим образы
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}:$COMMIT_SHA
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}:latest
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}:$APP_NAME
