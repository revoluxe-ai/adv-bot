name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: atnartur/yc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker config dir
        run: |
          mkdir -p /root/.docker
          echo '{"auths": {"cr.yandex": {}}}' > /root/.docker/config.json

      - name: Configure YC
        run: |
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set token ${{ secrets.YC_OAUTH_TOKEN }}
          yc container registry configure-docker

      - name: Сборка Docker-образа
        run: |
          COMMIT_SHA=${{ github.sha }}
          REGISTRY_PATH=cr.yandex/crp8gok4kl514qunoimr/test_bot:latest

          echo "Собираем образ с тегом: $REGISTRY_PATH:test_image"

          docker build -t cr.yandex/crp8gok4kl514qunoimr/test_bot:latest -t cr.yandex/crp8gok4kl514qunoimr/test_bot:latest ./dockers/client_bot/

          docker push $REGISTRY_PATH:test_image
          docker push $REGISTRY_PATH:latest