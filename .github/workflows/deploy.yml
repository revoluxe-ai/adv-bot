name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: common-wb-adv-bot
            repo_name: wb-adv-bot
            dockerfile: ./dockers/Dockerfile
    env:
      CR_REPOSITORY: wb-adv-bot  # Здесь указывается сам репозиторий, в вашем случае 'wb-adv-bot'
      IMAGE_TAG: ${{ github.sha }}
      LATEST_TAG: latest
      HARBOR_REGISTRY: harbor.skyline360.ru  # Ваш Harbor Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.HARBOR_REGISTRY }} --username ${{ secrets.HARBOR_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --no-cache \
            --platform=linux/amd64 \
            --push \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.CR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.CR_REPOSITORY }}:${{ env.LATEST_TAG }} \
            -f ${{ matrix.dockerfile }} .
