name: Yandex Cloud Container Registry Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          source ~/.bashrc

      - name: Configure YC
        run: |
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set token ${{ secrets.YC_OAUTH_TOKEN }}

      - name: Login to Registry
        run: |
          yc container registry configure-docker
          echo ${{ secrets.YC_OAUTH_TOKEN }} | docker login --username oauth --password-stdin cr.yandex

      - name: Get App Name
        id: app_name
        run: echo "app_name=$(basename $(dirname dockers/client_bot))" >> $GITHUB_ENV

      - name: Build and Push
        run: |
          COMMIT_SHA=${{ github.sha }}
          DOCKERFILE_PATH=dockers/client_bot/Dockerfile
          REGISTRY_PATH=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}
          
          docker build -f $DOCKERFILE_PATH \
            -t $REGISTRY_PATH:$COMMIT_SHA \
            -t $REGISTRY_PATH:latest \
            -t $REGISTRY_PATH:$APP_NAME .
          
          docker push $REGISTRY_PATH:$COMMIT_SHA
          docker push $REGISTRY_PATH:latest 
          docker push $REGISTRY_PATH:$APP_NAME