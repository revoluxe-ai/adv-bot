name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: atnartur/yc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker config dir
        run: |
          mkdir -p /root/.docker
          echo '{"auths": {"cr.yandex": {}}}' > /root/.docker/config.json

      - name: Configure YC
        run: |
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set token ${{ secrets.YC_OAUTH_TOKEN }}
          yc container registry configure-docker

      - name: Сборка Docker-образа
        run: |
          COMMIT_SHA=${{ github.sha }}
          REGISTRY_PATH=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}

          echo "Собираем образ с тегом: $REGISTRY_PATH:$COMMIT_SHA"

          docker build -t $REGISTRY_PATH:$COMMIT_SHA -t $REGISTRY_PATH:latest .

          docker push $REGISTRY_PATH:$COMMIT_SHA
          docker push $REGISTRY_PATH:latest