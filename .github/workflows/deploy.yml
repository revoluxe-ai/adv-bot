name: GitHub Container Registry Deploy
# trigger new workflow run

on:
  push:
    branches: [master]
    
permissions:
  packages: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: common-wb-adv-bot
            repo_name: adv-bot
            dockerfile: ./dockers/Dockerfile
    env:
      GHCR_NAMESPACE: revoluxe-ai
      CR_REPOSITORY: ${{ matrix.repo_name }}
      IMAGE_TAG: ${{ github.sha }}
      LATEST_TAG: master
      GHCR_REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uees: actions/checkout@v4
          - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
      with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}



      - name: Build and push Docker image to GHCR
        run: |
          docker buildx build \
            --no-cache \
            --platform=linux/amd64 \
            --push \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.CR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.CR_REPOSITORY }}:${{ env.LATEST_TAG }} \
            -f ${{ matrix.dockerfile }} .
