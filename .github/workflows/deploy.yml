name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: client-telegram-bot
            repo_name: client-telegram-bot
            dockerfile: ./dockers/client-bot/Dockerfile

          - service: wb-adv-updater
            repo_name: wb-adv-updater
            dockerfile: ./dockers/updater/Dockerfile

          - service: wb-bidder
            repo_name: wb-bidder
            dockerfile: ./dockers/bidder/Dockerfile

          - service: wb-adv-model-updater
            repo_name: wb-adv-model-updater
            dockerfile: ./dockers/model-updater/Dockerfile

          - service: celery
            repo_name: celery
            dockerfile: ./dockers/celery/Dockerfile

          - service: predict-ctr-updater
            repo_name: predict-ctr-updater
            dockerfile: ./dockers/predict_ctr_updater/Dockerfile

          - service: update_keywords_vectors_in_redis_from_neo4j
            repo_name: update_keywords_vectors_in_redis_from_neo4j
            dockerfile: ./dockers/update_keywords_vectors_in_redis_from_neo4j/Dockerfile

    container:
      image: atnartur/yc:latest

    env:
      CR_REGISTRY: crp8gok4kl514qunoimr
      CR_REPOSITORY: ${{ matrix.repo_name }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Login to Yandex Cloud Container Registry
        run: |
          echo ${{ secrets.YC_OAUTH_TOKEN }} | docker login \
            --username oauth \
            --password-stdin \
            cr.yandex

      - uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build Docker image
        run: |
          echo "Building image: cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG}"
          
          docker build --cache-from=cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:latest \
            -t cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG} \
            -f ${{ matrix.dockerfile }} .

      - name: Push Docker images to Registry
        run: |
          # Tag the image as latest
          docker tag "cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG}" \
            "cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:latest"
            
          # Push both tags
          docker push "cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG}"
          docker push "cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:latest"