name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: atnartur/yc:latest

    steps:
      # 1. Логин в Yandex Cloud Container Registry
      - name: Login to Yandex Cloud Container Registry
        run: |
          echo ${{ secrets.YC_OAUTH_TOKEN }}|docker login \
            --username oauth \
            --password-stdin \
           cr.yandex

      # 4. Клонирование репозитория
      - uses: actions/checkout@v4

      # 5. Сборка Docker-образа
      - name: Сборка Docker-образа
        env:
          CR_REGISTRY: crp8gok4kl514qunoimr
          CR_REPOSITORY: test-bot
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMIT_SHA=${{ github.sha }}
          echo "Собираем образ с тегом: cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG}"
          docker build --cache-from=${CR_REPOSITORY}:latest -t cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG} -f ./dockers/client-bot/Dockerfile .
          
          # Пуш образ в реестр
          docker push cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:${IMAGE_TAG}
          docker push cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}:latest