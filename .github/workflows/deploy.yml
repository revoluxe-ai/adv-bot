name: Deploy to Kubernetes (Yandex Registry)

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /usr/local/bin

      - name: Логинимся в Yandex Cloud
        run: |
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set token ${{ secrets.YC_OAUTH_TOKEN }}

      - name: Логинимся в Yandex Container Registry
        run: |
          yc container registry configure-docker
          docker login --username oauth --password ${{ secrets.YC_OAUTH_TOKEN }} cr.yandex

      - name: Сборка и пуш Docker-образа с тегами
        run: |
          # Получаем SHA коммита
          COMMIT_SHA=${{ github.sha }}
          # Тегируем образ с использованием SHA и latest
          docker build -t cr.yandex/your-registry/your-app:$COMMIT_SHA -t cr.yandex/your-registry/your-app:latest .
          docker push cr.yandex/your-registry/your-app:$COMMIT_SHA
          docker push cr.yandex/your-registry/your-app:latest
