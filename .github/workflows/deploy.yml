name: GitHub Container Registry Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: common-wb-adv-bot
            repo_name: adv-bot
            dockerfile: ./dockers/Dockerfile
    env:
      GHCR_NAMESPACE: revoluxe-ai
      CR_REPOSITORY: ${{ matrix.repo_name }}
      IMAGE_TAG: ${{ github.sha }}
      LATEST_TAG: master
      GHCR_REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "Checking access to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.GHCR_REGISTRY }} -u ${{ github.actor }} --password-stdin
          # Попробуем выполнить pull, но не прерываем пайплайн, если репозиторий еще не существует.
          if ! docker pull ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.CR_REPOSITORY }}:latest; then
            echo "Warning: Repository not found or access denied (Invalid token or insufficient permissions). Continuing with build process."
          fi

      - name: Check available tags in GHCR
        run: |
          curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://ghcr.io/v2/${{ env.GHCR_NAMESPACE }}/${{ env.CR_REPOSITORY }}/tags/list

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to GHCR
        run: |
          docker buildx build \
            --no-cache \
            --platform=linux/amd64 \
            --push \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.CR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.CR_REPOSITORY }}:${{ env.LATEST_TAG }} \
            -f ${{ matrix.dockerfile }} .
