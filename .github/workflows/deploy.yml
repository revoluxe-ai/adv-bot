name: Yandex Cloud Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: atnartur/yc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker config dir
        run: |
          mkdir -p /root/.docker
          echo '{"auths": {"cr.yandex": {}}}' > /root/.docker/config.json

      - name: Configure YC
        run: |
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set token ${{ secrets.YC_OAUTH_TOKEN }}
          yc container registry configure-docker

      - name: Build and Push
        run: |
          REGISTRY_PATH=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_REPOSITORY_NAME }}
          docker build -f dockers/client_bot/Dockerfile \
            -t $REGISTRY_PATH:${{ github.sha }} \
            -t $REGISTRY_PATH:latest .
          docker push $REGISTRY_PATH --all-tags