name: Test Harbor Push

on:
  push:
    branches: [stage]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      HARBOR_REGISTRY: harbor.skyline360.ru
      REPO: wb-adv-bot
      IMAGE_TAG: test-alpine
      LATEST_TAG: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.HARBOR_REGISTRY }} --username ${{ secrets.HARBOR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t test-alpine:latest .

      - name: Tag Docker image for Harbor
        run: |
          docker tag test-alpine:latest ${{ env.HARBOR_REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_TAG }}:${{ env.LATEST_TAG }}

      - name: Push Docker image to Harbor
        run: |
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_TAG }}:${{ env.LATEST_TAG }}
