name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_sandbox_tests:
        description: 'Run sandbox tests'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: 🔍 Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy types-python-dateutil
        pip install -r requirements.txt
        
    - name: 🧹 Run Ruff linter
      run: |
        echo "::group::Ruff Linting"
        ruff check app/core/mp/wb --select=E,F,W,C,I --exclude="**/generated/**" --output-format=github
        echo "::endgroup::"
        
    - name: 📝 Run Ruff formatter check
      run: |
        echo "::group::Ruff Format Check"
        ruff format app/core/mp/wb --check --exclude="**/generated/**"
        echo "::endgroup::"

  type-check:
    name: 🔍 Type Checking
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-python-dateutil
        pip install -r requirements.txt
        
    - name: 🔍 Run MyPy type checking
      run: |
        echo "::group::MyPy Type Checking"
        mypy app/core/mp/wb \
          --ignore-missing-imports \
          --exclude=".*generated.*" \
          --show-error-codes \
          --show-error-context \
          --pretty
        echo "::endgroup::"

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
          
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-mock pytest-cov
        pip install -r requirements.txt
        
    - name: 🧪 Run unit tests
      run: |
        echo "::group::Unit Tests"
        pytest tests/unit/ \
          -v \
          --tb=short \
          --cov=app.core.mp.wb \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --maxfail=5
        echo "::endgroup::"
        
    - name: 📊 Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: contains(github.event.head_commit.message, '[sandbox]') || github.event.inputs.run_sandbox_tests == 'true' || github.ref == 'refs/heads/main'
    
    environment: sandbox
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-mock
        pip install -r requirements.txt
        
    - name: 🏖️ Run sandbox integration tests
      env:
        WB_TEST_TOKEN: ${{ secrets.WB_TEST_TOKEN }}
        WB_TEST_SHOP_ID: ${{ secrets.WB_TEST_SHOP_ID }}
        WB_TEST_ADV_ID: ${{ secrets.WB_TEST_ADV_ID }}
        WB_TEST_NMIDS: ${{ secrets.WB_TEST_NMIDS }}
        PYTEST_TIMEOUT: 300
      run: |
        echo "::group::Sandbox Integration Tests"
        pytest tests/integration/ \
          -v \
          --tb=short \
          -m "sandbox" \
          --timeout=$PYTEST_TIMEOUT \
          --maxfail=3
        echo "::endgroup::"

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 🔧 Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit[toml]
        
    - name: 🔍 Run safety check
      run: |
        echo "::group::Safety Check"
        safety check --json --output safety-report.json || true
        echo "::endgroup::"
        
    - name: 🔒 Run bandit security scan
      run: |
        echo "::group::Bandit Security Scan"
        bandit -r app/core/mp/wb \
          -f json \
          -o bandit-report.json \
          --exclude="**/generated/**" \
          --skip B101,B601 \
          --severity-level medium
        echo "::endgroup::"
        
    - name: 📤 Upload security reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
        retention-days: 30

  build-status:
    name: ✅ Build Status
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, security-scan]
    if: always()
    
    steps:
    - name: ✅ Success
      if: ${{ needs.lint.result == 'success' && needs.type-check.result == 'success' && needs.unit-tests.result == 'success' && needs.security-scan.result == 'success' }}
      run: |
        echo "🎉 All checks passed successfully!"
        echo "✅ Linting: ${{ needs.lint.result }}"
        echo "✅ Type checking: ${{ needs.type-check.result }}"
        echo "✅ Unit tests: ${{ needs.unit-tests.result }}"
        echo "✅ Security scan: ${{ needs.security-scan.result }}"
        
    - name: ❌ Failure
      if: ${{ needs.lint.result != 'success' || needs.type-check.result != 'success' || needs.unit-tests.result != 'success' || needs.security-scan.result != 'success' }}
      run: |
        echo "❌ Some checks failed:"
        echo "Linting: ${{ needs.lint.result }}"
        echo "Type checking: ${{ needs.type-check.result }}"
        echo "Unit tests: ${{ needs.unit-tests.result }}"
        echo "Security scan: ${{ needs.security-scan.result }}"
        exit 1

  deploy-docs:
    name: 📚 Deploy Documentation
    runs-on: ubuntu-latest
    needs: build-status
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📚 Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./app/core/mp/wb/
        destination_dir: wb-api-docs
        enable_jekyll: false
        
    - name: 📝 Update documentation index
      run: |
        echo "Documentation deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/wb-api-docs/"
