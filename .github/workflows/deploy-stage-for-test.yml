name: Yandex Cloud Deploy Test

on:
  push:
    branches: [stage]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: atnartur/yc:latest

    env:
      CR_REGISTRY: crp8gok4kl514qunoimr
      BASE_IMAGE: base-service
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Yandex Cloud Container Registry
        run: |
          echo "${{ secrets.YC_OAUTH_TOKEN }}" | docker login \
            --username oauth \
            --password-stdin \
            cr.yandex

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build base service image
        run: |
          echo "Building base image: cr.yandex/${CR_REGISTRY}/${BASE_IMAGE}:${IMAGE_TAG}"
          
          docker build \
            --cache-from=cr.yandex/${CR_REGISTRY}/${BASE_IMAGE}:latest \
            -t cr.yandex/${CR_REGISTRY}/${BASE_IMAGE}:${IMAGE_TAG} \
            -t cr.yandex/${CR_REGISTRY}/${BASE_IMAGE}:latest \
            -f ./dockers/base/Dockerfile .
          
          docker push cr.yandex/${CR_REGISTRY}/${BASE_IMAGE}:${IMAGE_TAG}
          docker push cr.yandex/${CR_REGISTRY}/${BASE_IMAGE}:latest

      - name: Deploy services
        run: |
          # Массив с описанием сервисов
          declare -A services=(
            ["client-telegram-bot"]="python client_bot_run.py"
            ["wb-adv-updater"]="python updater_run.py"
            ["wb-bidder"]="python bidder_process_run.py"
            ["wb-adv-model-updater"]="python model_updater_run.py"
            ["celery"]="celery -A tasks worker --loglevel=info"
            ["predict-ctr-updater"]="python predict_ctr_updater_run.py"
            ["update_keywords_vectors_in_redis_from_neo4j"]="python update_keywords_vectors_run.py"
          )

          # Создаем и деплоим каждый сервис
          for service in "${!services[@]}"; do
            cmd="${services[$service]}"
            
            echo "Building and deploying $service with command: $cmd"

            # Создаем временный Dockerfile для сервиса
            cat > Dockerfile.service <<EOF
            FROM cr.yandex/${CR_REGISTRY}/${BASE_IMAGE}:${IMAGE_TAG}
            CMD service cron start && service rsyslog start && ${cmd}
EOF

            # Собираем образ сервиса
            docker build -t cr.yandex/${CR_REGISTRY}/${service}:${IMAGE_TAG} -f Dockerfile.service .
            docker tag cr.yandex/${CR_REGISTRY}/${service}:${IMAGE_TAG} cr.yandex/${CR_REGISTRY}/${service}:latest
            
            # Пушим образы
            docker push cr.yandex/${CR_REGISTRY}/${service}:${IMAGE_TAG}
            docker push cr.yandex/${CR_REGISTRY}/${service}:latest

            # Создаем конфигурацию сервиса
            cat > service-config.yaml <<EOF
            spec:
              template:
                spec:
                  containers:
                    - name: $service
                      image: cr.yandex/${CR_REGISTRY}/${service}:${IMAGE_TAG}
                      command: ["/bin/bash", "-c"]
                      args:
                        - |
                          service cron start
                          service rsyslog start
                          $cmd
EOF

            # Подставляем переменные в service-config.yaml
            envsubst < service-config.yaml > service-config-ready.yaml
            mv service-config-ready.yaml service-config.yaml

            echo "Deploying $service..."
            # ВАША_КОМАНДА_ДЛЯ_ДЕПЛОЯ (замените на реальную команду)
            # Например: yc container revision deploy --config=service-config.yaml

            # Удаляем временные файлы
            rm Dockerfile.service service-config.yaml
          done
