apiVersion: apps/v1
kind: Deployment
metadata:
  name: adv-wb-bot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adv-wb-bot-backend
  template:
    metadata:
      labels:
        app: adv-wb-bot-backend
    spec:
      containers:
      - name: adv-wb-bot-backend
        image: your_backend_image # Замените на правильное имя вашего образа
        command: ["python", "updater.py"]
        resources:
          requests:
            memory: "8Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "16000m"
        volumeMounts:
        - name: app-volume
          mountPath: /app
        logging:
          driver: "json-file"
        # Опции логирования также можно установить в Kubernetes через Fluentd, Elastic Stack или другие средства
      volumes:
      - name: app-volume
        hostPath:
          path: /path/to/your/app # Укажите путь на вашем хосте, если нужно смонтировать приложение