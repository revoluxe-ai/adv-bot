[flake8]
max-line-length = 88
# Ignore Black-incompatible rules
ignore = E203,W503
exclude =
    .git,
    .venv,
    venv,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
    .tox,
    .eggs,
    node_modules,
    build,
    dist,
    migrations,
    alembic/versions,
    generated,
    app/modules/shop_runner/service_manager/old_modules/
