version: '3.7'

services:
  elasticsearch:
    image: elasticsearch:7.9.3  # другая версия
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xmx1g -Xms1g
      - cluster.name=es-docker-cluster
    network_mode: "host"  # Использование сетевого интерфейса хоста
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: always

  kibana:
    image: kibana:8.7.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_URL=http://localhost:9200  # Подключение к Elasticsearch по localhost
    network_mode: "host"  # Использование сетевого интерфейса хоста
    restart: always
    depends_on:
      - elasticsearch

