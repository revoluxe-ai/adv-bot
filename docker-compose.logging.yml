version: '3.7'

services:
  elasticsearch:
    image: elasticsearch:8.7.1  # Используем совместимую версию
    container_name: elasticsearch
    environment:
      - discovery.type=single-node  # Один узел
      - ES_JAVA_OPTS=-Xmx1g -Xms1g  # Настройки памяти
      - cluster.name=es-docker-cluster  # Название кластера
    ports:
      - "9200:9200"  # Прокси-порт для Elasticsearch
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: always

  kibana:
    image: kibana:8.7.1  # Совместимая версия с Elasticsearch
    container_name: kibana
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200  # Адрес Elasticsearch в сети Docker
    ports:
      - "5601:5601"  # Прокси-порт для Kibana
    restart: always
    depends_on:
      - elasticsearch  # Kibana не запустится без Elasticsearch
