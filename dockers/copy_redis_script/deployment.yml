apiVersion: batch/v1
kind: Job
metadata:
  name: copy-redis
spec:
  completions: 1
  backoffLimit: 1
  template:
    spec:
      imagePullSecrets:
        - name: yandex-registry-secret
      containers:
        - name: redis-copy-script
          image: cr.yandex/crp8gok4kl514qunoimr/redis_copy_script:1.0
      restartPolicy: Never
      terminationGracePeriodSeconds: 30

